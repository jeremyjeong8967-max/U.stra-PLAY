<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>U.stra PLAY</title>
  <meta name="description" content="U.stra PLAY 브라우저 데모">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#1c3150 0,#101827 52%,#0b1220 100%);font-family:Arial,"Noto Sans KR",sans-serif;color:#f8fafc}.wrap{width:min(100%,760px);text-align:center}.mark{display:inline-flex;align-items:center;gap:10px;color:#60a5fa;font-weight:800;letter-spacing:.12em;font-size:13px}.symbol{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#0354ff;color:white;font-size:20px}h1{font-size:clamp(36px,7vw,58px);margin:22px 0 8px;letter-spacing:-.04em}.lead{color:#a8b5c8;margin:0 0 42px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}a.card{display:block;text-align:left;text-decoration:none;color:inherit;padding:28px;border:1px solid #33445d;border-radius:20px;background:rgba(30,45,67,.88);transition:transform .18s,border-color .18s,background .18s}a.card:hover{transform:translateY(-4px);border-color:#4285ff;background:#243956}.icon{font-size:34px}.eyebrow{margin:20px 0 7px;color:#60a5fa;font-size:11px;font-weight:800;letter-spacing:.14em}.card h2{margin:0 0 9px;font-size:23px}.card p{margin:0;color:#a8b5c8;font-size:14px;line-height:1.6}.go{display:inline-block;margin-top:23px;color:#93c5fd;font-size:13px;font-weight:700}footer{margin-top:42px;color:#718096;font-size:12px}@media(max-width:560px){.cards{grid-template-columns:1fr}a.card{padding:23px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark"><span class="symbol">P</span> U.STRA PLAY</div>
    <h1>PLAY MANAGEMENT</h1>
    <p class="lead">테스트 화면을 선택해 주세요.</p>
    <section class="cards" aria-label="서비스 선택">
      <a class="card" href="./admin/">
        <div class="icon">⚙️</div><div class="eyebrow">ADMIN</div>
        <h2>관리자 화면</h2><p>이벤트 설정, 게임 운영 및 테스트 데이터를 확인합니다.</p>
        <span class="go">관리자 화면 열기 →</span>
      </a>
      <a class="card" href="./games/">
        <div class="icon">🎮</div><div class="eyebrow">PLAYER</div>
        <h2>직원용 게임</h2><p>직원 참여 화면과 이벤트 게임을 브라우저에서 확인합니다.</p>
        <span class="go">게임 화면 열기 →</span>
      </a>
    </section>
    <footer>U.stra PLAY · Browser Demo · 테스트용 가상 정보만 사용하세요.</footer>
  </main>
</body>
</html>
